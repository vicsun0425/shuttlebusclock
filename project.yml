name: ShuttleBusClock
options:
  bundleIdPrefix: com.vicsun0425
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # ← 在 Xcode 里选自己的 Team,或构建时传 DEVELOPMENT_TEAM=XXXXXXXXXX

configs:
  Debug: debug
  Release: release

targets:
  ShuttleBusClock:
    type: application
    platform: iOS
    sources:
      - path: ShuttleBusClock
        excludes:
          - "**/.DS_Store"
    resources:
      - path: ShuttleBusClock/Resources/Assets.xcassets
      - path: ShuttleBusClock/Resources/Sounds/alarm.caf
      - path: ShuttleBusClock/Resources/PrivacyInfo.xcprivacy
    info:
      path: ShuttleBusClock/Info.plist
      properties:
        CFBundleDisplayName: 班车闹钟
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: "班车闹钟需要定位权限来识别你距离下车点还有多远,才能在到达前提醒你。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "班车闹钟需要始终定位权限,才能在 app 关闭或锁屏后依然在到达站点前叫醒你,避免你坐过站。"
        NSLocationAlwaysUsageDescription: "班车闹钟需要始终定位权限,才能在 app 关闭或锁屏后依然在到达站点前叫醒你,避免你坐过站。"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vicsun0425.shuttlebusclock
        TARGETED_DEVICE_FAMILY: "1"   # 仅 iPhone
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO

  ShuttleBusClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShuttleBusClockTests
    dependencies:
      - target: ShuttleBusClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vicsun0425.shuttlebusclock.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ShuttleBusClock:
    build:
      targets:
        ShuttleBusClock: all
        ShuttleBusClockTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShuttleBusClockTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release